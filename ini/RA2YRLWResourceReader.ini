; ============================================================================
; RA2YRLWResourceReader.ini  --  发行用模板
; ----------------------------------------------------------------------------
; 放在 RA2YRLWResourceReader.dll 旁边（也就是游戏根目录，与 gamemd.exe 同级）。
;
; 【本文件格式的两条硬规定，改的时候别破】
;   1) 注释必须独占一行。Win32 的 profile API 不会剥掉行尾注释，
;      写成 "Log=yes  ; 说明" 会把 "  ; 说明" 当成值的一部分。
;   2) 本文件只用 ASCII。包名一律 ASCII（引擎按字节比较文件名）。
;      需要写中文说明就写在 guides/ 里，不要写进这份 INI。
;
; 全部键都是可选的。整个 [Packs] 段不写 = 一个包都不注册，行为与不加本 DLL 一致。
; ============================================================================


[ResourceReader]
; 是否写 RA2YRLWResourceReader.log（yes/no，默认 yes）
; 排错基本靠它，除非确定不需要，否则别关。
Log=yes

; 是否校验目标 gamemd.exe（yes/no，默认 yes）
; 校验 size 与 md5 前 32 位（对应 Build B）。
; 不匹配只写告警，不阻止任何动作 —— 换 exe 也能继续试。
ValidateExe=yes

; 包名匹配是否区分大小写（yes/no，默认 no）
; no = 按大写比较（Windows 文件名语义），推荐保持 no。
CaseSensitive=no

; 编号族 %d 的展开范围（默认 1-99）
; 只影响带 %d / %02d / %03d 的条目，写法为 起-止，两端都含。
NumberRange=1-99

; 干跑模式（yes/no，默认 no）
; yes = 只做 exe 校验与代码点探针，写日志，但绝不动引擎内存。
; 用来在真机上先确认"四个地址探针是否通过"，再打开实际注册。
DryRun=no


[Packs]
; ---------------------------------------------------------------------------
; 要追加加载的 MIX 包，一行一个，键名随意（建议 0= 1= 2= ...）。
;
; **注册顺序 = 本段在文件里的书写顺序**（不是键名排序），先写的先注册。
; 所有包都在引擎自带的 expandmd 等注册完之后、追加到搜索表尾部，
; 因此不会抢引擎自带包的优先级。
;
; 三种写法：
;   普通名      lw_naval.mix            文件存在就注册；不存在跳过并写日志
;   编号族      lwpacks%02d.mix         展开成 lwpacks01.mix .. lwpacks99.mix
;   通配        lw_*.mix                对目标目录里实际存在的文件匹配
;
; 通配展开的结果按文件名排序（不区分大小写），保证联机双方顺序一致。
; 同一个包被多条规则命中时只注册一次（以最先命中的那条为准）。
; ---------------------------------------------------------------------------

; 示例（把行首的分号去掉即可启用）：
;0=lw_base.mix
;1=lw_naval.mix
;2=lwpacks%02d.mix
;3=lw_*.mix


[Packs.Exclude]
; ---------------------------------------------------------------------------
; 排除表，一行一个通配模式。**只作用于通配（lw_*.mix 这类）展开的结果**。
;
; 这里列出的模式，其匹配结果会被丢弃 —— 防止 *.mix 这类宽通配把引擎自带的
; 包重复注册一遍（重复注册会改变搜索顺序，也可能出别的问题）。
;
; 普通名与编号族**不受**本段约束：`ra2md.mix`、`expandmd%02d.mix` 是你明确
; 写下的枚举，一律放行（自检工具会给"疑似重复注册引擎自带包"的告警，但不拦）。
;
; 下列是**内建默认值**（即使本段全被注释掉也生效）。只包含原版引擎自己会加载的包名；
; 别的注入式扩展额外加载什么名字，是它们自己定的，本工具不去猜 —— 那种环境下你把名字
; 填到本段即可。把它们抄出来是为了让你看得见、并且可以自己增删。
; ---------------------------------------------------------------------------

; 引擎自带入口
;0=expandmd*.mix
;1=ra2md.mix
;2=langmd.mix
;3=ra2.mix
;4=language.mix

; 引擎自带的地图 / 影片 / 缓存 / 主题 / 多人
;5=mapsmd*.mix
;6=maps*.mix
;7=movmd*.mix
;8=moviemd*.mix
;9=movies*.mix
;10=ecache*.mix
;11=elocal*.mix
;12=thememd*.mix
;13=multimd*.mix
;14=multi*.mix
;15=local*.mix
;16=cache*.mix

; 你自己的排除项写在这下面：


[CSF]
; ---------------------------------------------------------------------------
; 要**合并**进游戏字符串表的 CSF 文件，一行一个，键名随意（建议 0= 1= 2= ...）。
;
; 引擎自己只读 ra2md.csf；本段让你把**任意文件名**的 CSF 加进来
; （`lwtext.csf`、`lwextra01.csf`、通配都行）。合并时机：引擎自己的字符串表
; 加载完成之后、正式初始化之前；先写的先合并。
;
; 与 [Packs] 的关系：
;   * 展开规则**完全一样**（普通名 / 编号族 / 通配，受 NumberRange 与
;     [Packs.Exclude] 约束）；
;   * 文件可以用引擎的文件系统找到 —— 也就是说**可以放在本 DLL 注册的 MIX 包里**，
;     不一定要散在游戏目录（通配只能看见散在目录里的文件）。
;
; 写法：
;   普通名      lwtext.csf
;   编号族      lwextra%02d.csf       展开成 lwextra01.csf .. lwextra99.csf
;   通配        lw_*.csf
;
; Override（默认 no）：
;   no  = 引擎自带的同名 label 优先，我们**只补引擎没有的**（推荐；不会动原版文本）
;   yes = 我们的文件覆盖引擎的（同名 label 用我们的值；后写的文件覆盖先写的）
;
; 找不到 / 格式坏的文件只写 RA2YRLWResourceReader.log，**不阻断启动**，也不会改动引擎内存。
;
; 排错：日志里搜 [CSF] ——
;   "读入 … N 条 label"      = 文件读到了、解析成功
;   "引擎已存在 → 保留引擎的" = 该 label 因 Override=no 被跳过
;   "引擎 LoadString(...)"   = 合并后**问引擎自己要一次**的自检结果（最关键的一行）
; ---------------------------------------------------------------------------

; 示例（把行首的分号去掉即可启用）：
;Override=no
;0=lwtext.csf
;1=lwextra%02d.csf
;2=lw_*.csf
